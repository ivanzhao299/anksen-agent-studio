name: Growth Platform CI

on:
  pull_request:
    paths:
      - 'packages/growth-core/**'
      - 'packages/growth-connectors/**'
      - 'apps/console/web/**'
      - 'package.json'
      - 'packages/domain-center/lib/*growth*'
      - 'packages/domain-center/test/*growth*'
      - 'packages/domain-center/test/enterprise-role-access.test.mjs'
      - 'packages/access-center/lib/access-center-utils.mjs'
      - 'packages/domain-center/bin/growth-platform-postgres-smoke.mjs'
      - 'packages/domain-center/package.json'
      - 'packages/orchestrator-core/migrations/012_growth_platform.up.sql'
      - 'packages/orchestrator-core/migrations/013_growth_score_history.up.sql'
      - 'packages/orchestrator-core/migrations/014_growth_delivery_ledger.up.sql'
      - 'packages/orchestrator-core/migrations/015_growth_delivery_audit.up.sql'
      - 'docs/growth-platform/**'
      - '.github/workflows/growth-platform-ci.yml'
  push:
    branches:
      - feature/anksen-ai-growth-platform
    paths:
      - 'packages/growth-core/**'
      - 'packages/growth-connectors/**'
      - 'apps/console/web/**'
      - 'package.json'
      - 'packages/domain-center/lib/*growth*'
      - 'packages/domain-center/test/*growth*'
      - 'packages/domain-center/test/enterprise-role-access.test.mjs'
      - 'packages/access-center/lib/access-center-utils.mjs'
      - 'packages/domain-center/bin/growth-platform-postgres-smoke.mjs'
      - 'packages/domain-center/package.json'
      - 'packages/orchestrator-core/migrations/012_growth_platform.up.sql'
      - 'packages/orchestrator-core/migrations/013_growth_score_history.up.sql'
      - 'packages/orchestrator-core/migrations/014_growth_delivery_ledger.up.sql'
      - 'packages/orchestrator-core/migrations/015_growth_delivery_audit.up.sql'
      - 'docs/growth-platform/**'
      - '.github/workflows/growth-platform-ci.yml'

permissions:
  contents: read

jobs:
  growth-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anksen-agent-studio/growth-core test
      - run: pnpm --filter @anksen-agent-studio/growth-core acceptance
      - run: pnpm --filter @anksen-agent-studio/growth-connectors test
      - run: node --test --test-name-pattern='sanitized delivery operations' apps/console/web/business-application-surfaces.test.mjs

  growth-postgres:
    needs: growth-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anksen-agent-studio/domain-center growth:postgres:smoke
