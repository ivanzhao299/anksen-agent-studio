name: anksen-studio-identity

services:
  identity-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    restart: unless-stopped
    depends_on:
      identity-db:
        condition: service_healthy
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-studio-bootstrap-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL_HOST: identity-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://studio.cnjinhu.com/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_FEATURES: cimd
      STUDIO_IDENTITY_BOOTSTRAP_USERNAME: ${STUDIO_IDENTITY_BOOTSTRAP_USERNAME:-studio-admin}
      STUDIO_IDENTITY_BOOTSTRAP_PASSWORD: ${STUDIO_IDENTITY_BOOTSTRAP_PASSWORD:?STUDIO_IDENTITY_BOOTSTRAP_PASSWORD is required}
    ports:
      - "127.0.0.1:4320:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      - ./client-policies:/opt/anksen/client-policies:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s
    security_opt:
      - no-new-privileges:true

volumes:
  identity-db-data:
