name: anksen-gitea

services:
  database:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    secrets:
      - database-password
    volumes:
      - gitea-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [gitea-backend]
    security_opt:
      - no-new-privileges:true

  server:
    image: docker.gitea.com/gitea:28.2.0-rootless@sha256:94807314454f6525994a3b76286ba12bc7e7f8cd14f61d9e67431767f8103306
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: database:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD__FILE: /run/secrets/database-password
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:?GITEA_DOMAIN is required}
      GITEA__server__ROOT_URL: https://${GITEA_DOMAIN}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:?GITEA_SSH_DOMAIN is required}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__server__SSH_LISTEN_PORT: "2222"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: github
      GITEA__packages__ENABLED: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY__FILE: /run/secrets/secret-key
      GITEA__security__INTERNAL_TOKEN__FILE: /run/secrets/internal-token
      GITEA__oauth2__JWT_SECRET__FILE: /run/secrets/jwt-secret
      GITEA__log__MODE: console
      GITEA__log__LEVEL: Info
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /run/secrets/runner-registration-token
    secrets:
      - database-password
      - secret-key
      - internal-token
      - jwt-secret
      - runner-registration-token
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    ports:
      - "127.0.0.1:${GITEA_HTTP_PORT:-4340}:3000"
      - "${GITEA_SSH_BIND_ADDRESS:-192.168.2.204}:${GITEA_SSH_PORT:-2222}:2222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [gitea-backend, gitea-egress]
    security_opt:
      - no-new-privileges:true

  runner:
    image: docker.io/gitea/runner:2-dind-rootless@sha256:0ba6851043b9fe7a12b3bb3c57a581f59a09337d954256aa5a80cbe47a921242
    restart: unless-stopped
    privileged: true
    depends_on:
      server:
        condition: service_healthy
        restart: true
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: ${GITEA_RUNNER_INSTANCE_URL:-https://${GITEA_DOMAIN:?GITEA_DOMAIN is required}}
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /run/secrets/runner-registration-token
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-office-204-ci-1}
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS:-ubuntu-22.04:docker://node:22-bookworm}
      DOCKER_HOST: unix:///run/user/1000/docker.sock
      DOCKERD_ROOTLESS_ROOTLESSKIT_NET: slirp4netns
      DOCKERD_ROOTLESS_ROOTLESSKIT_MTU: "65520"
    secrets:
      - runner-registration-token
    volumes:
      - ./runner-config.yaml:/config.yaml:ro
      - gitea-runner-data:/data
      - gitea-runner-docker:/home/rootless/.local/share/docker
    networks: [gitea-egress]
    security_opt:
      - apparmor=rootlesskit

networks:
  gitea-backend:
    internal: true
  gitea-egress:

volumes:
  gitea-database:
  gitea-data:
  gitea-config:
  gitea-runner-data:
  gitea-runner-docker:

secrets:
  database-password:
    file: ${GITEA_STATE_DIR:?GITEA_STATE_DIR is required}/secrets/database-password
  secret-key:
    file: ${GITEA_STATE_DIR}/secrets/secret-key
  internal-token:
    file: ${GITEA_STATE_DIR}/secrets/internal-token
  jwt-secret:
    file: ${GITEA_STATE_DIR}/secrets/jwt-secret
  runner-registration-token:
    file: ${GITEA_STATE_DIR}/secrets/runner-registration-token
