log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 3h
  shutdown_timeout: 30s
  fetch_timeout: 5s
  fetch_interval: 2s
  fetch_interval_max: 5s
  workdir_cleanup_age: 24h
  idle_cleanup_interval: 10m
  labels: []

cache:
  enabled: true
  dir: /data/cache
  host: ""
  port: 0

container:
  network: ""
  privileged: false
  options: >-
    --cap-drop=ALL
    --security-opt=no-new-privileges
  valid_volumes: []
  docker_host: unix:///var/run/docker.sock
  force_pull: true

host:
  workdir_parent: data/workspaces
