services:
  night-shift-postgres-test:
    image: postgres:16-alpine
    container_name: anksen-night-shift-pg-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anksen_night_shift_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anksen_night_shift_test"]
      interval: 2s
      timeout: 2s
      retries: 30
